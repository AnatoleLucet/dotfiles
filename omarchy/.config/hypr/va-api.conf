# === GPU CONFIGURATION ===
# XPS 14 (2026): single Intel Arc (Panther Lake, xe driver). No dGPU.
# DisplayLink dock outputs are driven via the evdi kernel module; evdi
# devices are pre-created at boot (/etc/modprobe.d/evdi.conf) so Hyprland's
# DRM backend opens them at startup. No AQ_DRM_DEVICES override is needed
# with a single render-capable GPU.

# VA-API: use Intel for video decode
env = LIBVA_DRIVER_NAME,iHD
env = VDPAU_DRIVER,va_gl
env = LIBVA_DRIVERS_PATH,/usr/lib/dri
